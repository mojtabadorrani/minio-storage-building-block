name: Build and Test

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore MinioStorage.BuildingBlock.slnx

      - name: Build
        run: dotnet build MinioStorage.BuildingBlock.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test MinioStorage.BuildingBlock.slnx --configuration Release --no-build